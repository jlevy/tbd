  - bead_id: is-01m0c5r461zmx3ctgsxq94s0bq
    external_id: a5613359-e8f4-4a5a-aecc-b27c64c5870e
    kind: update_issue
    patch:
      description: >-
        tbd has one actor field, so an agent cannot hold a bead without displacing the
        human accountable for it. Adds `delegate` beside `assignee` and replaces
        identity configuration with identity resolution: humans resolve against each
        tracker's own member directory and bind by provider user id, agents carry the
        agid-{ulid} identity tbd already mints and never publish except through an
        explicit agent_map.


        Identity is per provider — a Linear UUID and a GitHub login are different
        identifiers — with the tbd handle as the join key and bindings under
        bridge/<provider>/users/.


        Design discussion: https://github.com/jlevy/tbd/issues/246

        Sibling: epic tbd-og20 (state axis, https://github.com/jlevy/tbd/issues/244)
