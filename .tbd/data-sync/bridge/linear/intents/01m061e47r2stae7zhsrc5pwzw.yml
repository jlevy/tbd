    client_id: b7156dc3-9e35-4ac8-b657-0891b031d57f
    kind: create_issue
    patch:
      description: "Orphaned pairs (archived/trashed/deleted remotes) skip reconciliation, but
        confirm they are also excluded from the per-sync fetch and comment-listing sets.
        If a pair quiesces logically but still costs a targeted fetch or a listComments
        per sync, archival never actually shrinks the quiet-sync cost — and shrinking
        steady-state cost is half the point of the lifecycle. Measure with the mock's
        request log: N linked + M orphaned pairs should cost the same as N linked."
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 3
      status: open
      title: Verify orphaned pairs cost zero requests per sync
