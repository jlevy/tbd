      description: >-
        Two goldens invert when 0.7.0 ships. Split by when each can be done.


        DONE (in the release commit): the doctor's 'Launcher fallback' warning
        disappears once the running version can read f08, so
        cli-orientation-golden.tryscript.md now expects a plain '✓ Launcher fallback'.


        AFTER PUBLISH: validate-upgrade-package.mjs regains a genuine same-format
        baseline. sameFormatBaseline currently defaults to 0.6.3 (an f07 client, which
        must fail closed against an f08 candidate). Once 0.7.0 is on npm, set
        TBD_UPGRADE_SAME_FORMAT_FROM=0.7.0 — or change the default — so the suite proves
        an f08 client upgrading an f08 repository. This cannot be done before publishing
        because the script installs the baseline from the registry.
