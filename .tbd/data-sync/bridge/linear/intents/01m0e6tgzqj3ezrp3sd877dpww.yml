    patch:
      description: >-
        Beads carry a reference to the live agent session working on them (provider,
        session id, URL, status), rendered in tbd web and the Linear managed block,
        populated by thin per-runtime adapters. Provider-neutral by construction so no
        single agent runtime or wrapper vendor is load-bearing.


        See spec: plan-2026-08-19-agent-session-refs-and-runtimes.md

        See research: research-2026-08-19-agent-runtimes-and-session-linkage.md
      priority: 1
      status: open
      title: "Agent session refs: link live agent runs from beads, Linear, and tbd web"
