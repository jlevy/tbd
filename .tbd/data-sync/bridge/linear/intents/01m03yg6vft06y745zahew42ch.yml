    client_id: 82fec4e9-db54-4ec0-adb4-f627f3738a36
    kind: create_issue
    patch:
      description: >-
        An agent that crashes mid-work leaves a bead in_progress with an assignee
        forever, and tbd ready hides it from every other agent (ready means open,
        unblocked, AND unclaimed).


        tbd stale already defaults to open + in_progress over 7 days, which is right for
        open work and far too long for 'an agent is actively holding this'. Surface
        claim age in prime and in the Linear roll-up, and consider a shorter default for
        claimed beads.


