  - bead_id: is-01m00mw87c585dzj8yxfxm9er5
    client_id: 69378054-10f5-49b7-967d-591996d3832c
    kind: create_issue
    patch:
      description: >-
        PROVEN by round-trip probe: a bead carrying refs: and docs: written by a newer
        tbd comes back from an older client's parse-and-write with BOTH FIELDS SILENTLY
        DELETED, while extensions: survives (it is a declared field with opaque
        contents).


        IssueSchema is a plain Zod object, so it parses in strip mode. The blast radius
        is larger than the f07 config case: a config strip loses one file's block on an
        explicit command; a bead strip loses metadata across EVERY bead an old client
        touches, and tbd sync rewrites beads during ordinary merges. Data-loss vector,
        not an inconvenience.


        Three layers, not one:

        - Parse (IssueSchema): strip drops unknown keys -> must preserve.

        - Serialize (sortKeys, yaml-utils.ts:63-73): iterates Object.keys(obj) ->
        ALREADY CORRECT, no change.

        - Merge (mergeIssues, git.ts:790-792): starts from {...base} then iterates the
        fixed FIELD_STRATEGIES table, so a key added on only ONE side is never copied ->
        needs a default strategy for keys outside the table.


        f08 should do for beads what f07 did for config: preserve unknown keys AND bump
        the format so pre-f08 clients fail closed rather than deleting metadata they do
        not understand. After f08, an additive bead field never needs another bump.


        Migration is metadata-only (a stamp, like f05 and f07). No issue file is
        rewritten, so the upgrade is abortable by restoring .tbd/config.yml and deleting
        $GIT_COMMON_DIR/tbd/layout.yml.


        Spec: plan-2026-08-14-external-sync-and-traceability.md Phase 2

