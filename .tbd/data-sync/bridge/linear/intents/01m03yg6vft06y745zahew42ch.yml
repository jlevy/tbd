  - bead_id: is-01m00h6nssev3wydw37zz68nhn
    client_id: 8373dd0d-bed3-44ec-b452-66ca02971ced
    kind: create_issue
    patch:
      description: >-
        Gemini CLI hooks live in the hooks object of .gemini/settings.json (project) or
        ~/.gemini/settings.json. Events: BeforeTool, AfterTool, BeforeAgent, AfterAgent,
        BeforeModel, AfterModel, BeforeToolSelection, SessionStart, SessionEnd,
        Notification, PreCompress. Output supports systemMessage,
        hookSpecificOutput.additionalContext (BeforeAgent, AfterTool, SessionStart), and
        decision allow|deny with reason.


        There is no blocking stop event, so Gemini gets orientation (prime on
        SessionStart, prime --brief on PreCompress) and a last-chance sync on
        SessionEnd, but the completion gate degrades to a reminder.


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md §2.5, §6
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 3
      status: open
      title: Add a Gemini CLI setup surface (settings.json hooks)
