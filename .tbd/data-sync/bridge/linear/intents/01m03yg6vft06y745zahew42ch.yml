  - bead_id: is-01m00h60xmsj85fqn07wkrtjqd
    client_id: 5864358b-05bd-42b9-b41e-0cf936aea22e
    kind: create_issue
    patch:
      description: >-
        Wire tbd closing --check to Claude Code's Stop event (exit 2 blocks the turn and
        returns stopReason to the model) and Codex's Stop (continue:false). Cursor's
        equivalent is stop -> followup_message. Gemini CLI has no blocking stop event
        and degrades to a reminder.


        Two constraints keep it from trapping the agent: (1) block on inaction, not on
        failure — exit 2 only when no sync has been attempted since the last bead
        mutation, because an agent cannot fix an expired credential by trying harder;
        (2) fire at most once per session, keyed on session id plus sync-branch tip.


        Build this last: enforcing a protocol agents have not been taught produces
        blocked turns.


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md §6, §6.1
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 2
      status: open
      title: Stop-event completion gate for Claude Code and Codex
