  - bead_id: is-01m00h6q764kkt4jekkeqjz5kb
    client_id: 8333e756-3ca6-4d5b-8124-18c385622ebd
    kind: create_issue
    patch:
      description: >-
        ensureMeta caches on the adapter instance only, so every CLI invocation
        re-fetches the team's workflow states and label pages — the most expensive query
        in the set (53 complexity points measured). Cache per team on disk under the
        gitignored state area with a TTL; cuts roughly a third of the requests from a
        routine sync and makes frequent syncing comfortably cheap.


        Context: a no-op full sync is ~4 GraphQL requests against a measured 2,500
        req/hour ceiling, so this is an efficiency win rather than a blocker.


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md §3.3, E8
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 3
      status: open
      title: Cache Linear provider meta on disk with a TTL
