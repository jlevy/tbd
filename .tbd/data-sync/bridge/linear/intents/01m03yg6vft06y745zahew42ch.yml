    kind: create_issue
    patch:
      description: >-
        MEASURED: of the 89 non-epic beads carrying an active spec, 79 (89%) inherited
        it from an ancestor carrying the same spec. tbd update --spec propagates to
        descendants (update.ts:129-130) and create --parent inherits it
        (integration-runner.ts:434).


        So the default policy's 'specs: active' clause really means 'mirror every
        descendant of every epic with a live spec' — which is why it selects 45% of
        active beads rather than the advertised ~10% (F1). That is a mechanism, not
        sloppy authoring, and it changes the fix: selecting only the bead that CARRIES
        the spec would cut the mirror sharply and probably match what people expect the
        rule to say.


        Related open question: should spec_path be renamed, or joined by doc_path? It
        already accepts any repository path and propagates usefully, but the name stops
        agents from pointing it at research or architecture docs. A rename is a format
        concern; an alias is not.


