  - bead_id: is-01m00mw9ppcnxpzvqakekq5tpc
    client_id: ccea668b-196d-43a7-89bb-d7cdbb0a9297
    kind: create_issue
    patch:
      description: >-
        A bead needs one GOVERNING doc plus any number of supporting ones. spec_path
        stays exactly as it is — singular, inherited by descendants, load-bearing for
        selection and list --spec. docs is what else you should read: plural, local, not
        inherited.


        Value is a repo-relative PATH, not a URL, because: the docs are in the same repo
        so a path is stable where a URL is branch-dependent; specPermalink already
        resolves any repo path to a branch-correct GitHub blob URL (permalink.ts:74-84),
        so rendering is solved; and paths union-merge trivially.

          docs:
            - path: docs/project/research/current/research-2026-08-14-....md
              role: research
            - path: docs/project/architecture/current/arch-testing.md
              role: architecture

        role is an OPEN string with known values (research, architecture, qa, design),
        not a closed enum. Identity is path, so repeated adds are idempotent and docs:
        'union' slots into FIELD_STRATEGIES beside labels and dependencies with no new
        merge machinery.


        Kept separate from refs deliberately: a doc is a path in this repo (resolvable,
        permalinked, branch-aware) and a ref is a URL to an external system (opaque, may
        404 independently). Merging them forces every consumer to branch on 'is this a
        path or a URL' and loses the permalink resolution that already works.
        Alternative flagged as Open Question 5 in the spec.


        CLI: tbd doc add <bead> <path> [--role ...], tbd doc rm, rendered by tbd show.


        Depends on f08.


