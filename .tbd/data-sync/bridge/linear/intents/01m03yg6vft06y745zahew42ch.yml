    patch:
      description: >-
        tbd sync --push calls runEnabledIntegrationPushes (sync.ts:205) — the same
        one-way projection as tbd integration sync --push, with no three-way reconcile.


        The setup-linear shortcut warns joiners in bold never to run that command: 'The
        outbound-only path projects local bead values over the tracker without a
        three-way reconcile, so it can overwrite a teammate's Linear-side edit that a
        full sync would have detected and reported as a conflict.' The warning names
