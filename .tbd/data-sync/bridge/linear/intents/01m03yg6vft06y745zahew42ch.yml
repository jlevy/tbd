  - bead_id: is-01m00h4kq7ywbxdn9nz2tedv7b
    client_id: dc4bbd81-49ba-4668-bf0a-ed5a04e23a86
    kind: create_issue
    patch:
      description: >-
        tbd-session.sh (and the .codex twin) does: export
        PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH". Prepending
        /usr/local/bin shadows the caller's toolchain. Reproduced here:
        /usr/local/bin/node is v20.20.2 while the session Node is v22.22.2, so 'npx
        --yes get-tbd@0.6.1 prime' fails the version check and the script exits 1.
        Claude Code treats a non-zero non-2 SessionStart exit as a non-blocking error
        whose stderr goes to the debug log, so the agent silently gets no tbd context.


        Fix: append rather than prepend the fallback locations; prefer local resolution
        (node_modules/.bin, then global tbd) before npx; emit {"systemMessage": "..."}
        on failure so a broken hook is visible.


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md §1.3, E7
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 1
      status: open
      title: Fix tbd-session.sh PATH order and make hook failure visible
