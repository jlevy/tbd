    kind: create_issue
    patch:
      description: >-
        Worked example, from this brief: the research doc was written first, an epic was
        created afterwards to track it, 24 children were filed under that epic — and
        spec_path was set on NONE of them until the traceability section went looking
        and found the linkage missing. Nothing in tbd prime, the skill tiers,
        new-research-brief, or AGENTS.md asks for it. new-research-brief says to create
        the document and update it as you learn; it never mentions a bead.


        What the shortcut should say:

        1. Bead first — create the tracking epic when the research STARTS, titled for
        the question, spec_path pointed at the doc that is about to exist.

        2. Sync immediately, so the epic shows in Linear as Started while the work is
        under way rather than as a fait accompli.

        3. File children as findings turn into work; they inherit spec_path
        automatically.

        4. Attach the PR when it opens, and the GitHub issue if one exists.

        5. Attach the plan spec to the same epic when research turns into a plan, so one
        bead carries the whole arc: question -> findings -> plan -> implementation.


        Same edit belongs in new-architecture-doc and new-plan-spec.


