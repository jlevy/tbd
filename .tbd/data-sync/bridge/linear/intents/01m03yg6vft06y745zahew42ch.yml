  - bead_id: is-01kzyh140ydwhzr4mt8r84gmgb
    client_id: 6258fc73-21ec-44cd-89c0-89ec690ae6b2
    kind: create_issue
    patch:
      description: >-
        'tbd integration sync --push' and 'tbd sync --push' route to
        runEnabledIntegrationPushes -> planMirror/applyMirror (the Phase 1 one-way
        mirror). Bare sync and --pull route to runSync. runSync has no outbound-only
        mode (direction?: 'both' | 'inbound', sync-engine.ts:143).


        Taking the --push path means: no three-way reconcile (a Linear-side edit is
        overwritten with no conflict comment and no archived artifact), no bridge base
        written, no intent journal (no crash replay), no comment push, and parentId:
        null can un-parent a provider issue.


        Docs present --push as simply 'outbound only' -- the same operation, half the
        directions -- and the manual recommended it as the first step for new users.


        Fix (pick one):

        (a) Add direction: 'outbound' to runSync, route --push through it, retire
        planMirror/applyMirror.

        (b) Keep both engines, document the divergence honestly, stop recommending
        --push as the onboarding default.


        The doc half of (b) landed in the review branch. (a) is the real fix.
      parentId: 7202337e-d1ee-4192-bb6c-c6ae42b97469
      priority: 1
      status: open
      title: "Consolidate --push onto the sync engine: two engines behind one flag vocabulary"
