  - bead_id: is-01m00h6mdt1t263xgyn6ht00d5
    client_id: d36968b7-cdaf-406f-bbf9-26fbdeb78ea6
    kind: create_issue
    patch:
      description: >-
        Cursor hooks are production, not beta: .cursor/hooks.json (project) or
        ~/.cursor/hooks.json (user). sessionStart returns additional_context; stop
        returns followup_message, which auto-continues the agent and is Cursor's
        analogue of continue:false; beforeShellExecution returns {permission:
        allow|deny|ask}. Event names are camelCase and the payload contract differs from
        Claude/Codex, so this needs its own adapter script rather than a copy.


        tbd installs nothing for Cursor today even though Cursor reads AGENTS.md and
        .agents/skills/. Adds a 'cursor' entry to the setup surface registry.


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md §2.4, §6
