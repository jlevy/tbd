  - external_id: f1363c49-cc37-4472-8edf-5f44de0bc481
    kind: update_issue
    patch:
      description: >-
        Decision required before Phase 2 override roundtrip work. Depends on Q16.


        - A. Computed-by-name (current). Cheap; no extra state. Roundtrip degrades when
        upstream renames/removes.

        - B. Frontmatter pointer in override doc (_upstream: {source_id, docref,
        revision, content_hash}).

        - C. Sidecar edge (.tbd/overrides.yml or <file>.override.yml).

        - D. tbd-internal overlay file (.tbd/docmap-overrides.yml). Single source of
        truth.


        Cases that get muddy without provenance: late-arriving upstream creates fake
        override; removing upstream loses diff/unfork data; upstream rename loses
        discoverability; tbd source upstream PR needs exact upstream
        source/path/revision.


        Spec section: ## Open Questions → Q18 (line ~856).
  - external_id: 0c0d0100-26fa-4991-bee8-ce9e225de7c6
    kind: update_issue
    patch:
      description: >-
        as: currently means two unrelated things:

        - On a source: "treat this source as a single named item rather than a bag of
        files" (whole-repo/single-URL mode).

        - On a contents rule: "rename this upstream doc on import."


        Options:

        - A. Keep as-is and document the two meanings.

        - B. Split into mode: discriminator on sources (files|file|repo); as: only on
        contents rules as rename semantics. Cleanest.

        - C. KDEX-aligned: as: repo literal; as: <name> only on contents rules.


        Spec section: ## Open Questions → Q19 (line ~891).
