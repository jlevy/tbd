      description: "Define pull requests as implementation relationships, not generic
        issue-sync targets: GitHub issues participate in outbound projection, explicit
        inbound creation, and two-way sync, while PRs are read-only associations stored
        in extensions.github.prs with stable repo/number/url and refreshed display
        metadata. Add provider-generic helpers that preserve the existing
        extensions.github issue-link payload, CLI verbs to link/unlink/list PR
        associations without changing PR title/body/state, and Linear
        attachmentLinkGitHubPR/attachmentLinkGitHubIssue upserts keyed by URL. Cover
        namespace merges, stale/closed PR refresh, duplicate association idempotency,
        and coexistence with a GitHub issue link."
