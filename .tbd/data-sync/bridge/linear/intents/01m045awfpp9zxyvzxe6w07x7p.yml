  - bead_id: is-01m044ppfx0jkk2ddfe2faf5pn
    client_id: 8884680f-5cbe-418b-bfed-9262f24db5da
    kind: create_issue
    patch:
      description: >-
        Every live sync of this repository ends with two warnings:

          ! OS-166: Linear assignee is not present in user_map; assignee synchronization skipped.
          ! OS-162: Linear assignee is not present in user_map; assignee synchronization skipped.

        integrations.linear.identity.user_map is {} in .tbd/config.yml, so any
        Linear-side assignee has no canonical alias to map to and assignee sync is
        skipped for that pair. Not a code defect — the guard is working — but it means
        the assignee field is inert for those issues, and the warnings are permanent
        noise on an otherwise clean sync.


        Map the Linear users to their tbd aliases, or decide assignee stays local-only
        and downgrade the message.
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 3
      status: open
      title: Populate identity.user_map so assignee sync stops being skipped
