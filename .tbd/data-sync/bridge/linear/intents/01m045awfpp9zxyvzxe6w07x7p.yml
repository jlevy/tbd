  - bead_id: is-01m044qhmd5be33jt0rj5e710g
    client_id: 4b6d44e1-e8a3-4ee6-a16f-c9253b272088
    kind: create_issue
    patch:
      description: >-
        Two things the sync deliberately does not do, both now more relevant because
        more repositories are planned for the opensource team:


        1. customViewCreate for the 'label is not tbd:sync' filter view. API-creatable
        and small, but creating shared views in someone's workspace is more invasive
        than labels and wanted a human decision.

        2. Labels are created team-scoped, matching prior behaviour. Cross-team
        consolidation would want workspace scope (omit teamId). A config decision, not a
        code gap.


        Worth settling together, since both are about how a shared workspace is meant to
        be organised once several repos report into it.
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
