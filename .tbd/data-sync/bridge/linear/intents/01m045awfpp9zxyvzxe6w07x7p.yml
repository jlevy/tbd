  - bead_id: is-01m044ntts3mchercdbj5ysc1w
    client_id: 46a50021-938f-404f-83ee-bde1d36dd1f8
    kind: create_issue
    patch:
      description: >-
        `tbd integration sync --push` runs the one-way mirror (applyMirror), which
        writes bead links but no bridge records. Since the tracker identifier moved to
        the bridge record, a push-only workflow now stores it nowhere.


        Self-healing: the next full sync repairs it, and `tbd sync` folds a full
        integration sync in, so this is transient rather than permanent. It is still a
        mode inconsistency of the kind we are trying to avoid.


        Cheap to fix: ISSUE_UPDATE_MUTATION already selects `issue { id identifier url
        updatedAt }` (src/integrations/linear/queries.ts:127), but applyChanges narrows
        the return to `{updatedAt}` and discards the rest. Widen it and let the mirror's
        caller persist the identifier — no extra request.
      parentId: 1ef43a0c-0cf8-4944-a374-327de127108c
      priority: 2
      status: open
      title: Mirror-only push maintains no bridge record, so identifiers never refresh
