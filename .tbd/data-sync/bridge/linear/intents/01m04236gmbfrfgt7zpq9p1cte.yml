  - bead_id: is-01m00h57nkvtvkbqn992w5fm2e
    external_id: 4fd428a0-cc81-4317-b53f-78118f9b0b9b
    kind: update_issue
    patch:
      description: >-
        One verb, symmetric with tbd close: 'tbd start <ids...>' sets status=in_progress
        and assignee=<resolved agent identity>; '--sync' publishes immediately.
        Collapses three concepts an agent must currently remember to combine, and gives
        hooks something unambiguous to check. ready/start/close is a complete teachable
        vocabulary; 'update --status' is a generic escape hatch that happens to also do
        this.


        Open question: should it sync by default (--no-sync opt-out) or opt in (--sync)?


        Research: research-2026-08-14-agent-sync-protocol-and-hooks.md E1, §3.2
