      description: >-
        f08 compatibility contract, test T3: mixed-version Linear convergence. Both
        0.8.1 and the candidate honor LINEAR_API_URL (linear/client.ts:111), so a packed
        0.8.1 client and the candidate can alternate `tbd integration sync` against the
