        deferred_until (main treats it as not ready since #264, 0.8.1 does not); an item
        in In Review; a team with no Backlog state; a #267 pair seeded by 0.8.1 (base
        duplicate, remote Canceled, bead with duplicate_of); a flattened deep child
        (1e); one 0.8.1 `--push` run in the middle. Assert both versions are quiet by
        run 4, no Linear state flips between Todo and Backlog, and no duplicate_of is
        lost.


        Gates tbd-od0z, tbd-alws, tbd-4c5c, and the Phase 1B engine (tbd-6md1). If a
        scenario cannot converge with 0.8.1, the change ships with a stated minimum
        version for every clone that runs integration sync, or opt-in.
