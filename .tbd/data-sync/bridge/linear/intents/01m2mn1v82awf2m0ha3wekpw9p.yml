    kind: create_issue
    patch:
      description: >-
        GH #267. Plan 1a. Ships in the same PR as tbd-od0z, never before it.


        Confirmed trace: a bead closed as duplicate has slot duplicate; the outbound
        decomposition turns that into resolution canceled (slots.ts:162-164), so Linear
        gets Canceled while the base records duplicate. Next run reads canceled, only
        the remote changed, so it pulls resolution canceled (sync-engine.ts:802-818)
        onto a bead that still carries duplicate_of; writeIssue rejects it
        (schemas.ts:392-397, storage.ts:74-77); the per-pair catch fires before the base
        advances (:1440, :1473-1480); repeats every run. Not a partial projection: the
        only parse sites are storage.ts:74 and parser.ts:104.


        The earlier fix (clear duplicate_of whenever a patch carries another resolution)
        would make the sync succeed by converting the duplicate into a cancel and
        deleting the pointer. With tbd-od0z the phantom remote change disappears
        (duplicate is written to Linear's duplicate state type). Then: BeadPatch gains
        duplicate_of; applyTerminalAxis(stored, patch) applies status, resolution,
        duplicate_of together at sync-engine.ts:1383-1398; inbound duplicate on a bead
        with resolution duplicate and a pointer keeps both; the downgrade to canceled
        (:806-810) applies only to a bead with no pointer; a patch that genuinely moves
        the bead out of the duplicate position clears the pointer as reopen.ts:139-144
        does.


        e2e through the built CLI (engine unit tests' writeBead never runs
        IssueSchema.parse): tbd close <id> --as duplicate --duplicate-of <other>; sync
        three times; pointer survives and nothing fails; move the remote to Todo; sync;
        bead reopens with the pointer cleared. Correct state-model spec lines 511 and
        513 (at PR #283's head): the duplicate relation items are checked but
        unimplemented (tbd-vp4p).


        f08 compatibility review 2026-09-14 (see 'f08 Compatibility Contract for Sprint
        Fixes' in the stability sprint plan): UPGRADE HAZARD. Every existing #267 pair
        already holds base duplicate, remote Canceled, and a bead with duplicate_of
        (0.8.1's pull failed before the base advanced). Under the rule above, the new
        client reads that as a remote change to canceled and clears the pointer on its
        first run, even with no old clients. Rule: when the base is duplicate, the bead
        carries resolution duplicate with a pointer, and the remote is canceled, treat
        the slots as agreeing and push the Duplicate state. Add a test seeded from
        0.8.1-shaped state, not only a fresh pair; also covered by tbd-s4kb (T3).
      hold: null
