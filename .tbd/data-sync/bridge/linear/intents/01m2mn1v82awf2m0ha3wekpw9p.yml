    external_id: 520e1b4d-5520-4fdb-9aef-371431076375
    kind: update_issue
    patch:
      description: >-
        On claim, write a session ref with provider 'local', the harness session id
        where

        detectable, a minted id where not, the actor from resolveAgentIdentity, and
        started_at.

        This is the degenerate case that makes the feature useful with no adapter and no
        network.


        Technique for detecting the harness session id: read the harness's own history
        files, as

        codecast's daemon does for Claude Code, Codex CLI, Cursor, and Gemini. Read once
        at

        claim time rather than watching continuously. Unresolved harnesses fall back to
        a minted

        id, which is still useful.
