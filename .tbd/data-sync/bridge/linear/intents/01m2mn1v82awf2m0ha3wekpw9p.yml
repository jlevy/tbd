    kind: create_issue
    patch:
      description: >-
        Same flake observed twice in the v0.2.0 push window: tests/lockfile.test.ts >
        withLockfile > serializes concurrent access within a single process fails with
        'EPERM: operation not permitted, mkdir' on Windows. Hit on PR CI (passed on
        rerun) and on main CI after merge (hung 20+ min, had to be cancelled).


        History: 89014f7 'fix: prevent short-ID mapping loss during concurrent issue
        creation', 2578056 'fix: increase lockfile test timeout for Windows CI
        flakiness', ac65cdf 'fix: use short staleMs in lockfile concurrency test for
        Windows'. At least three prior stabilization passes; still flaky.


        Options to weigh:

        - Mark the concurrent-access test as it.runIf(!isWindows) or describe.skip on
        Windows with a comment pointing to a Windows-specific issue. Cuts CI noise but
        loses concurrency coverage on Windows.

        - Replace mkdir-based lockfile with a Windows-friendly primitive (e.g.,
        proper-lockfile, or write-rename-then-delete).

        - Investigate the underlying EPERM: rmdir cleanup race on Windows runners may
        need a retry/backoff.


        Acceptance: main CI on a release merge commit consistently goes green within the
        typical 4-5 minutes, not 20+.
      hold: null
