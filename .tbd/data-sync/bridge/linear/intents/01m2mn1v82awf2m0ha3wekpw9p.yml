      description: >-
        Root cause 1 of the sprint plan. spec_path is validated once at write time by
        resolveSpecArg (project-paths.ts:263-290, fs only, SPEC_SEARCH_ROOT 'docs' at
        :229) and never afterward; the only git-backed existence check is
        findBranchContaining (permalink.ts:75-90). Add lib/spec-lifecycle.ts with
        resolveSpecLocation(storedPath) returning present | moved (exactly one file with
        that basename elsewhere under the specs dir) | ambiguous (several) | on-branch
        (git ls-tree over refs/heads and refs/remotes finds it; bounded, cached per run)
        | missing. Config specs.dir, default docs/project/specs; lifecycle folder =
        first segment beneath it. Doctor, tbd spec status, list --specs, write-time
        validation and spec move all call this one function. Pure unit tests over a
        fixture tree for all five classes.


        Revision 2026-09-13 (plan review against main and PRs #278-#283): Classify
        against the trunk ref (origin default branch) with the working tree only as an
        overlay; otherwise results flap between checkouts (36 beads already point at
        done/ paths that exist only on PR #283's branch). Order must be present, then
        moved, then on-branch, or a stale active/ path on an old branch reads as
        on-branch. Use one `git cat-file --batch-check` over ref:path pairs (about 1s
        for 8,745 pairs) rather than per-ref ls-tree (about 4 minutes measured). Count
        only refs not merged into trunk and show their age. Folders in this repo:
        active, backlog, current, done, paused, plus archive from PR #278; no future.
        The write-time search covers docs/ while the resolver scans specs.dir, so a
        moved research doc cannot classify as moved.


        f08 compatibility review 2026-09-14 (see 'f08 Compatibility Contract for Sprint
        Fixes' in the stability sprint plan): specs.dir is a top-level key (kept by
        0.7.0 and 0.8.1). Do not reinterpret the existing select.specs: active relative
        to specs.dir (lib/schemas.ts:557-563), or old and new clients select different
        beads for the mirror.
