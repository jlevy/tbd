    external_id: b7b629d1-3e7d-4801-9d01-28a98b9ace6a
    kind: update_issue
    patch:
      description: "Add session references with provider, stable session id, optional URL,
        actor, and start time, after deciding schema compatibility and merge identity.
        September 6 source review corrects the old no-format-bump assumption: IssueRef
        currently requires URL, strips unknown nested fields, and merges by URL. Outer
        issue f08 passthrough does not protect this shape. Specify a stable namespaced
        session key, alias/URL changes, same-ID divergent content handling, and
        old-client behavior; prove preservation or define a format/migration boundary.
        Tests must cover URL-less local refs, two sessions with absent/shared URLs,
        old-reader read/write/merge/recovery, and different agents attaching refs to one
        bead. Coordinate invocation identity with tbd-6nmq. Governing runtime plan
        retains durable ref, volatile status, and bridge projection lifetimes; no
        runtime vendor decision is required."
