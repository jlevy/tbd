    kind: create_issue
    patch:
      description: "GH #273. validateFileExists (project-paths.ts:182-200) checks the working
        tree only, so a spec on an unmerged branch fails with 'File not found' and beads
        whose spec lives on a branch read as missing in every triage. Beads live in a
        branch-independent store; specs are branch-local; validating against one
        checkout is a category error. resolveSpecArg falls through to the resolver's git
        lookup; an on-branch result is accepted with a notice naming the branch.
        --no-verify on create and update skips existence checks (path still normalized
        and inside the project) for a spec uncommitted in another worktree. No ref is
        persisted (branches merge; a stored ref goes stale); doctor and spec status
        compute 'on branch' at read time. Tryscript: pinned 'Error: File not found'
        cases at tests/cli-spec-linking.tryscript.md:148, :363, :453 stay for a path on
        no ref."
