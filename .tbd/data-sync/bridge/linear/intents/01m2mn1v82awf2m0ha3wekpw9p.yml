  - bead_id: is-01m044p8vkya3s129dqr09qszy
    client_id: 8174f6b4-e2fd-4a21-a29c-87d888763c5f
    kind: create_issue
    patch:
      description: >-
        Wall-clock and git-heavy tests fail intermittently under parallel load. Evidence
        from 2026-08-15/16, every one passing in isolation immediately after:


        - tests/performance.test.ts 'reads 100 random issues in <500ms' — failed under
        `vitest run --coverage`; measured 190ms alone.

        - tests/git-remote.test.ts 'reads random issues from large repo in <10ms each' —
        failed at load average 44, passed at 18.

        - At load average 34, one run failed 7 tests across 4 files:
        common-dir-layout-doctor (2), git-remote 'pushes sync branch to remote',
        setup-hooks (2), worktree-health (2). All four files passed in isolation, and
        the whole suite passed at load average 7.


        So this is wider than the two timing assertions: the git and worktree tests are
        load-sensitive too, presumably through git subprocess timing and shared temp-dir
        pressure.


        Two distinct problems:


        1. Flaky signal. The budgets measure the machine, not the code.

        2. A flake in the vitest half aborts `test:coverage` before the tryscript
        goldens run at all — the script is `vitest run --coverage && tryscript run` — so
        an unrelated blip silently skips 1101 golden assertions. This bit the 2026-08-15
        verification directly.


        Fix (2) regardless of (1): the goldens should run even when vitest fails. For
        (1): raise the budgets, skip them under coverage, or cap concurrency for the
        git-heavy files.
      hold: null
      priority: 2
      resolution: null
      slot: todo
      status: open
      title: Wall-clock perf assertions flake under parallel load and coverage
