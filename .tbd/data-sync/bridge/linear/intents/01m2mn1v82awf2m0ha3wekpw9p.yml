  - bead_id: is-01m1yzx83jc1eyn522mxfg5cc1
    client_id: 2f970134-325e-47da-8b11-920305d0fcaa
    kind: create_issue
    patch:
      description: >-
        GH #265 (the alternation) and the In Review drag. Plan 1a.


        Confirmed from code: localViewOf computes backlog for an open, not-ready bead
        (sync-engine.ts:209-231; readyIssueIds excludes delegated, held,
        future-deferred, and open-blocker beads). The outbound path decomposes the slot
        back into bead fields (sync-engine.ts:781-785, decomposeSlot slots.ts:158-178),
        collapsing backlog and todo into open; statusToLinear maps open to unstarted
        (Todo); Todo reads back as todo (slotFromLinear). slotToLinear (mapping.ts:394)
        has no caller. Once the link record holds an exact slot the pair alternates
        pull/push forever while the column never moves. tie_break plays no part. In
        Review is pulled then pushed back as in_progress, which resolves to In Progress
        by name (mapping.ts:295-298): a one-time drag, not a loop. adapter.ts:1030-1032
        sets stateId only if resolved, with no else, so an unresolvable state push
        counts as pushed.


        Fix: CanonicalPatch carries the slot and the adapter writes it via slotToLinear
        (named state, else type default plus carrier label; backlog to Backlog,
        duplicate to the duplicate type). Before the matrix, project local through the
        team's write mapping and remote through the bead's decomposition; agreement in
        either projection means no write; the base records the agreed slot in the
        remote's terms. Unresolvable state is a skipped field with a reason (excluded
        under 1b). Correct state-model spec line 551 (at PR #283's head) which marks
        band-level refinement comparison done.


        Tests, red first: open epic blocked by an open bead synced five times, runs 3-5
        quiet; In Review stays over four runs; team with only Doing and In Review
        started states reports a skipped field; pure property test that
        slotFromLinear(write(slot)) returns the slot or a declared tolerated one for a
        default team and a team with no optional states (tests/slots.test.ts:105-118
        passes the refinement back in, which production never does); Paused settles
        after one pull (guard).


        f08 compatibility review 2026-09-14 (see 'f08 Compatibility Contract for Sprint
        Fixes' in the stability sprint plan): DESIGN CHANGE. Keep base.slot in the local
        vocabulary and do the two-vocabulary comparison in memory only; 0.8.1 compares
        base.slot exactly (reconcile.ts:262-265, slots.ts:242), so a base stored in
        remote terms makes a 0.8.x teammate push every run. If a remote-form value must
        persist, add an optional field whose absence means derive (old clients drop
        undeclared fields: BridgeBaseSchema/LinkRecordSchema are not passthrough, and
        0.7.0 already drops slot and refinement_*). Readiness differs across versions
        (main treats a future deferred_until as not ready, 0.8.1 does not) and 0.8.x
        --push writes Todo, so the Backlog write can ping-pong with 0.8.x clients: gated
        by tbd-s4kb (T3); if T3 cannot converge, Release 1 states a minimum version for
        every clone that runs integration sync, or the Backlog write is opt-in.
      hold: null
      parentId: dd42e056-d545-47ff-a532-ffe0d6a519dc
      priority: 1
      resolution: null
      slot: in_progress
      status: in_progress
