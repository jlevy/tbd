  - bead_id: is-01m0dsa6kqmmmt269gx5hfq53y
    external_id: c600ba31-b457-4a7f-b309-6096a816bb50
    kind: update_issue
    patch:
      description: >-
        Volatile status and updated_at live in .tbd/state.yml (local, untracked), not on
        the

        bead, so a status poll never produces a commit. Derive 'stale' locally when
        updated_at

        passes a threshold; stale wins over whatever the provider last reported.


        Refresh design, verified against bb's tasks plugin source (attic/bb,
        plugins/tasks/lifecycle/index.ts):

        - Events first where a push channel exists, reconciliation as the low-frequency
        backstop.

        - Reconcile only non-terminal refs; settled sessions cost nothing.

        - Terminal statuses are sticky: once done/failed, never transitioned again.

        - bb's cadences for reference: 5 min reconcile when links are live, 60 s idle
        poll otherwise.


        One deliberate divergence from bb: bb maps a session its API can no longer find
        to

        'completed'. tbd maps it to 'stale'. A vanished session may equally have
        crashed, and

        guessing optimistically about liveness is the failure mode that destroys trust.
