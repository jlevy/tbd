  - bead_id: is-01m1yzww834nfmwxqsrp4pxa8y
    client_id: 6e20ee34-77e0-4319-a19c-14cdd7663b73
    kind: create_issue
    patch:
      description: >-
        GH #272. skippedOutbound (beads past max_nesting) is a term in both nothingToDo
        computations (sync-engine.ts:1076 and :1678-1692); it is recomputed from the
        graph every run and nothing but re-parenting or a policy change can clear it, so
        one deep bead means nothing-to-do is never reached. Define the report classes
        actionable / suppressed / excluded / failed / blocked (plan 1a). Excluded =
        standing conditions: past max_nesting, a field push the provider or user_map
        cannot carry (capability-limited skippedPushes), importable items under
        inbound.mode: report. nothingToDo is true when actionable, suppressed and failed
        are empty; excluded is reported every run and never counts. Red-green: a second
        runSync over an unchanged deep bead reports nothingToDo true and lists the bead
        as excluded (beside tests/integrations-sync-engine.test.ts:693).


        Revision 2026-09-13 (plan review against main and PRs #278-#283): Also count
        orphaned in both nothingToDo terms (the dry-run term never did). A skipped push
        is excluded when its cause is policy or capability (assignee: local, missing
        user_map entry, unresolvable state) and failed otherwise. Suppressed still holds
        nothingToDo false. Coordinate the docs change with PR #283, which documents
        'nothing to do' as the steady state in tbd-docs.md (~2005, ~2221) and
        skill-baseline.md (~283).
      hold: null
      parentId: dd42e056-d545-47ff-a532-ffe0d6a519dc
