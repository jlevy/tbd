  - bead_id: is-01m2egwz6r0qgbtvzh2nkevjdb
    client_id: 583270dd-d2ed-4669-a375-d52300d2d719
    kind: create_issue
    patch:
      description: >-
        Implements tbd-dqiq option (a). One planner, planSync(scope), returns classified
        actions (push, pull, create, import, block splice, attachment refresh, parent,
        comment, conflict, replayed intent) plus the excluded/suppressed/failed/blocked
        classes from 1b. `--push` applies outbound kinds and `--pull` inbound kinds; the
        rest is reported as suppressed. The base advances per field for what was
        applied, replacing the whole-record rule at sync-engine.ts:1433-1472. One bulk
        guard over the filtered actions before any write; one printer; one JSON report
        type. `tbd sync --push/--pull --integrations` become the same filters, and `tbd
        sync --integrations` runs after the git merge (integration-runner.ts:5-10).


        Tests: property that the --push and --pull plans are disjoint subsets of the
        bare plan for any state; a push-only run does not advance the base of a field it
        did not write.


        f08 compatibility review 2026-09-14 (see 'f08 Compatibility Contract for Sprint
        Fixes' in the stability sprint plan): no new intent op kinds (an unrecognized
        intent makes old listIntentFiles throw for the whole provider,
        intents.ts:152-157, read even on dry and --pull runs) and no new op-level
        fields; reuse update_issue, upsert_attachments, and splice_description. Add a
        unit guard that the engine emits only the 0.7.0 set of op kinds. Per-field base
        advance is safe (same fields; linked items are always fetched in full). Gated by
        tbd-s4kb (T3) and tbd-9fpp (T4).
