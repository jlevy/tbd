    patch:
      description: >-
        GH #269 part 1. runBulk (update.ts:313-349) refuses --parent and --spec as
        per-ID flags; both take one value applied to every ID, like --priority. Rule:
        bulk-eligible = one value applies to every ID; per-ID-only stays --title,
        --description, --notes, --notes-file, --from-file, --child-order; --status stays
        with close/reopen. Bulk --parent: resolve once; run checkParentAssignment
        (issue-hierarchy.ts:52-83) for every ID against the graph as it will be after
        all moves (parent not among the IDs or their descendants; depth <=
        MAX_PARENT_DEPTH); abort before any write. Apply: parent_id, spec inheritance
        when the child has none (update.ts:203-213), hint append once, and removal from
        each old parent's hints (nothing removes today; schemas.ts:300-303). Bulk --spec
        propagates per update.ts:257-274. Extract the copy-pasted hint append
        (update.ts:239-255, create.ts:222-238, integration-runner.ts:623) into
        lib/child-order.ts. Generate the refusal message's list from the flag table;
        tbd-design.md:3021-3023 lists a different set today. Tryscripts: set containing
        the parent, set containing an ancestor of the parent, legal move; old-parent
        hints no longer carry the child (gap in tests/child-order-e2e.test.ts).


        Revision 2026-09-13 (plan review against main and PRs #278-#283): Depth must
        include each moved subtree's height (the single-issue check walks ancestors
        only; fix it too or state one rule). runBulk reads every issue before writing
        (update.ts:380-386): apply all moves, hint removals, and --spec propagation to
        one in-memory map and write each file once, or a stale copy of an old parent
        that is also in the ID set undoes the removal. Old-parent hint removal is
        best-effort: the union merge rule (file/git.ts:467) restores hints on any
        concurrent edit, and display already filters stale hints; do not pin it in
        tests. The design-doc disagreement is partly fixed by PR #283, which lists
        --delegate and --hold (tbd-design.md ~3376-3378).
