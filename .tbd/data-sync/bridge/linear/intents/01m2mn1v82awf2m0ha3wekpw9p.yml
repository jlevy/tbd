  - bead_id: is-01kzp7rd5ap1sgzqgs3ejdwn5a
    client_id: ac24d02e-ed81-4d9a-8145-1b8515560cc1
    kind: create_issue
    patch:
      description: "A SIGTERM/crash during tbd sync leaves the empty lock directory
        .git/tbd/locks/data-sync.lock behind. There is no staleness or PID detection on
        the shared data-sync lock, so every later sync waits on it silently until
        killed, each kill orphaning a fresh lock. tbd doctor checks only parent-dir
        writability ('Shared lock writability') and reports the repository healthy,
        giving the operator no signal. Observed live 2026-08-10 after a machine crash
        and again after each timeout-kill. Fix: record owner PID (like refs/tbd/watch
        reclamation in bead-watch.ts), reclaim ownerless empty lock dirs on acquisition,
        and teach doctor to flag a stale lock."
      hold: null
      priority: 2
      resolution: null
      slot: todo
      status: open
      title: Orphaned empty data-sync.lock blocks all syncs; doctor reports healthy
