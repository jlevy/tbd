  - bead_id: is-01kzn5121n6gc6xk9w710631cf
    client_id: 4a8e905a-4ca4-4752-8b44-c9429f93bde0
    kind: create_issue
    patch:
      description: "Bridge state on the tbd-sync branch at .tbd/data-sync/bridge/<provider>/.
        state.yml per link: external id, external updatedAt at last sync, and the base
        tuple (canonical field snapshot). The base is what makes sync a true three-way
        merge. Lives on the sync branch so it is shared and versioned; merges are
        per-bead-keyed map unions, same story as mappings/ids.yml. Secrets never appear
        here. Spec Component 10."
      priority: 2
      status: open
      title: "integrations/core/bridge-state.ts: state.yml, meta.yml, base tuples"
  - bead_id: is-01kzn512cr6x4z2bb5yns27mn0
    client_id: 3c59726b-a627-44e5-add4-787d72fb078b
    kind: create_issue
    patch:
      description: "diffAgainstBase(current, base) and mergeFieldwise(base, local, remote),
        reusing the shape of mergeIssues in file/git.ts. Local diff = bead vs base;
        remote diff = mapped external issue vs base. Fields changed on only one side
        merge silently: this is what keeps conflicts rare rather than merely survivable.
        Spec Component 10."
      priority: 2
      status: open
      title: "integrations/core/three-way.ts: diffAgainstBase and fieldwise merge"
  - bead_id: is-01kzn512qgfk7bt4grjfwcsab9
    client_id: 1bc76460-8812-4ce8-b3bf-5844dee9ef8b
    kind: create_issue
    patch:
      description: "There is no transaction spanning git and an external API, so compensate:
        before any external write, append planned writes (with client-generated UUIDs)
        to intents.yml and commit; on restart, unfinished intents replay. Attachment
        writes are idempotent by design; issueCreate replays treat duplicate-id as
        success; issueUpdate replays are followed by a base refresh so they cannot echo.
        Sync runs under the existing repo-scoped data-sync lock, so git serializes
        volunteers exactly as it already does for tbd sync. Tests simulate a crash at
        each step. Spec Component 10."
      priority: 2
      status: open
      title: "integrations/core/intents.ts: write-ahead journal and replay"
  - bead_id: is-01kzn5132f7f1gntqbg68wg2hv
    client_id: 5454db30-4257-4fac-a0d5-5e1daffadbd7
    kind: create_issue
    patch:
      description: "When BOTH sides changed the same field: resolve by configured per-field
        owner, else LWW; archive the loser to the existing attic; AND call
        postConflict() to post a comment naming the field, both values, and the attic
        path. commentResolve/commentUnresolve exist (verified), so a conflict report has
        a native handled/unhandled state an agent can query later. Track comment ids in
        bridge state. This is the requirement that conflicts are never silently
        resolved. Spec Component 10."
      priority: 2
      status: open
      title: "Conflict handling: attic entry plus external comment with resolve lifecycle"
  - bead_id: is-01kzn513dx5caz86bq89cm502s
    client_id: 08910b15-b6fe-47d0-9668-fc74bde4b973
    kind: create_issue
    patch:
      description: "Batched pull filtered on updatedAt (page cap 250); push scan of local
        diffs. Echo suppression: after a push record the post-write updatedAt and
        refresh base, so the next pull sees no remote diff for tbd's own write (no actor
        filtering needed, works with a plain API key). Orphans: archived or deleted
        external item -> mark link orphaned and warn, NEVER auto-delete a bead; deleted
        bead -> external item untouched, reported. Failure containment: external errors
        mark the run degraded and are reported per link, git phases still complete,
        external failure never blocks or corrupts git sync. Spec Component 10."
      priority: 2
      status: open
      title: "tbd integration sync: batched pull, push, echo suppression, orphans"
  - bead_id: is-01kzn513t5rt6bak750hcvzeta
    client_id: 490f9047-fbe4-4065-92bf-9cf61aad7c3f
    kind: create_issue
    patch:
