    kind: update_issue
    patch:
      description: >-
        Decision required before substantive Phase 2 work. Three options:

        - A. Keep current shape (resolveLookupKey takes flat priority-ordered array,
        returns one entry).

        - B. Add typed mode parameter ({type?, mode? in: effective|all|strict}).
        Minimum-viable response to design review.

        - C. Two-layer DocGraph (lossless inventory) + DocMap (policy view). Cleanest
        separation; biggest refactor; right shape if/when docref+docmap get extracted.


        Open: do typed commands pass type constraint at call site, or does dispatcher
        inject it?


        Spec section: ## Open Questions → Q15 (line ~775).

        Source: PR #117 senior-design review comment from jlevy, point 1.
  - external_id: 6ee3b84b-b2fc-49ad-be84-fefeb25c8cd0
    kind: update_issue
    patch:
      description: >-
        Decision required before substantive Phase 2 work; gates Q17/Q18.


        - A. Keep 1:1 (current). Simplest; one sources array.

        - B. Split bundles from sources. Two top-level arrays: bundles: (priority,
        hidden, local_root) and sources: (with bundle: reference and stable id:).
        Multiple sources per bundle.

        - C. Optional grouping. Default 1:1; opt-in join-existing-bundle via bundle:
        <existing-name>.


        Use cases cited by reviewer for B: org docs (repo + canonical URLs), tbd Phase 3
        migration (small core + external repo), product bundle (refs+examples+code in
        different repos), multiple URL sources presenting as one bundle.


        Spec section: ## Open Questions → Q16 (line ~806).
  - external_id: 767bd6ce-192e-418a-a2ca-3b7954ff1f7d
    kind: update_issue
    patch:
      description: >-
        Decision required before Phase 2 lockfile work. Depends on Q16.


        - A. Keep current shape: docref + revision + content_hash.

        - B. Add source_id only: stable manifest-level id; lockfile entries reference
        it. Solves "same docref twice" and bundle-rename cases.

        - C. Full reviewer recommendation: source_id, docref, source_config_hash (hash
        of materialization-affecting fields), revision, content_hash, materialization.


        Q17 Options B/C need source ids, which Q16 Option B introduces.


        Spec section: ## Open Questions → Q17 (line ~832).
  - external_id: f1363c49-cc37-4472-8edf-5f44de0bc481
    kind: update_issue
    patch:
      description: >-
        Decision required before Phase 2 override roundtrip work. Depends on Q16.


        - A. Computed-by-name (current). Cheap; no extra state. Roundtrip degrades when
        upstream renames/removes.

        - B. Frontmatter pointer in override doc (_upstream: {source_id, docref,
        revision, content_hash}).

        - C. Sidecar edge (.tbd/overrides.yml or <file>.override.yml).

        - D. tbd-internal overlay file (.tbd/docmap-overrides.yml). Single source of
        truth.


        Cases that get muddy without provenance: late-arriving upstream creates fake
        override; removing upstream loses diff/unfork data; upstream rename loses
        discoverability; tbd source upstream PR needs exact upstream
        source/path/revision.


        Spec section: ## Open Questions → Q18 (line ~856).
  - external_id: 0c0d0100-26fa-4991-bee8-ce9e225de7c6
    kind: update_issue
    patch:
      description: >-
        as: currently means two unrelated things:

        - On a source: "treat this source as a single named item rather than a bag of
        files" (whole-repo/single-URL mode).

        - On a contents rule: "rename this upstream doc on import."


        Options:

        - A. Keep as-is and document the two meanings.

        - B. Split into mode: discriminator on sources (files|file|repo); as: only on
        contents rules as rename semantics. Cleanest.

        - C. KDEX-aligned: as: repo literal; as: <name> only on contents rules.


        Spec section: ## Open Questions → Q19 (line ~891).
  - external_id: e317500b-8de7-4581-b1fb-100d11cf3b9c
    kind: update_issue
    patch:
      description: >-
        Q20 has sub-decisions (Q20a-f). Per spec linkage section: Q20a+b+c can ship
        together in Phase 1 schema (rename + glob-first contents); Q20d is implicit;
        Q20e (CLI alias generation) can happen later in Phase 1 or early Phase 2.


