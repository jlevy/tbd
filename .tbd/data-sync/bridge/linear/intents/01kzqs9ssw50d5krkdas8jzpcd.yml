        tbd-vc9e): replay pending intents -> pull linked (derived watermark = max
        remote_updated_at minus generous overlap; over-fetch is free because base
        comparison discards no-ops) -> reconcile per field_sync -> apply (external
        writes with per-pair failure containment, then bead patches via the normal issue
        write path, then base advance + intent cleanup, committed) -> policy scan
        (create outbound-new, import or report inbound per mode) -> honest report
        distinguishing nothing-to-do from did-something. Bulk guard both directions.
        Correctness never depends on timestamps. See spec section 10."
