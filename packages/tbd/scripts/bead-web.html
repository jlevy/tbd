<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tbd beads</title>
    <script>
      // Applied before first paint so a stored dark choice never flashes light.
      // Kept tiny and dependency-free for exactly that reason.
      (function () {
        try {
          var mode = localStorage.getItem('tbd.themeMode') || 'system';
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          document.documentElement.setAttribute('data-theme-mode', mode);
          if (mode !== 'system') document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          /* Private mode or blocked storage: fall through to system. */
        }
      })();
    </script>
    <style>
      /* ─────────────────────────────────────────────────────────────────
         Design system — HSL tokens, no literals outside :root.

         Every color is defined ONCE as a --token on the base :root and
         referenced via var(--token) everywhere else. Literal hex / rgb /
         hsl values must not appear anywhere else in this stylesheet,
         including the theme override blocks. Enforced by
         tests/bead-web-css.test.ts.

         Why HSL (hsl(H S% L%)):

           1. Hue encodes family. Tokens sharing a hue are meant to read
              as related: every neutral sits on 215° so surfaces, borders,
              and text feel like one material; wake/amber is 38°, ready/
              green is 149°, error/red is 0°. To add a token, pick the hue
              that places it in the right family first, not a color that
              looks nice alone.

           2. Lightness is the theme knob. Each --dark-* token holds H and
              S roughly fixed against its light counterpart and moves L.
              Never shift hue to dim a color; lower L.

           3. Saturation is the loudness knob. Status and wake colors are
              higher S; surfaces, borders, and body text are near-grey.

           4. Typography marks data, not decoration. Chrome — labels,
              counts, phase words, anything the UI says about itself — is
              sans (--sans). Monospace (--mono) is reserved for data
              values: ids, paths, branch names, SHAs, commands,
              timestamps, and field deltas. A count is chrome even when
              it is a number; tabular-nums keeps columns aligned without
              pretending the count is data.

         ── Motion: two families, never mixed ──────────────────────────

         This is the load-bearing rule of the whole stylesheet.

         DATA motion (--motion-data, `.flash` / `.leaving`) means the bead
         graph itself moved: a bead was created, edited, or deleted, and
         `tbd watch` or the local file watcher observed it. It is the amber
         wake color, and it is the ONLY thing allowed to use that color for
         movement. It fires once per data change and settles back to
         transparent, so it reads as an event rather than a state.

         UI motion (--transition-fast) means the viewer changed, not the
         data: a filter edited, a row expanded, a control focused. It is a
         short neutral transition and it MUST NOT use the wake color or the
         flash keyframes. Re-slicing a filter is not news.

         Conflating the two is the specific bug this rule exists to
         prevent: highlighting rows amber because a filter revealed them
         tells the user something changed upstream when nothing did. The
         server decides which is which via `state.dataVersion`, so the
         browser never infers "changed" from what happens to be on screen.

         Both families collapse to 1ms under prefers-reduced-motion, which
         keeps the amber color context while removing the movement.
         ───────────────────────────────────────────────────────────────── */
      /* ── Theme: three states, one palette source ────────────────────

         The gear picks system / light / dark, after metabrowser and kpress.
         `data-theme-mode` records the user's choice; `data-theme` records
         what it resolved to. "system" stamps no data-theme, so the media
         query decides.

         Both dark contexts below are pure remaps of the --dark-* tokens
         declared once in :root. That is why no literal appears outside this
         first block, and why the two dark blocks cannot drift apart: they
         contain no values of their own. Enforced by
         tests/bead-web-css.test.ts.
         ─────────────────────────────────────────────────────────────── */
      :root {
        /* Neutrals — one hue (215°) so every surface reads as one material.
           --bg is pure white, so its saturation is 0 and the hue is inert; it is still
           written as 215 so the family is legible and the dark retune lines up. */
        --bg: hsl(215 0% 100%);
        --panel: hsl(220 20% 97%);
        --border: hsl(215 15% 87%);
        --text: hsl(215 20% 10%);
        --muted: hsl(215 9% 43%);

        /* Interactive accent — links, focus rings, active toggles. */
        --accent: hsl(220 82% 55%);

        /* Semantic status. Shared with the row tags and the watch pill. */
        --ok: hsl(149 68% 30%);
        --err: hsl(0 64% 46%);

        /* Wake family (38°, amber). Reserved for DATA motion. Nothing that
           responds to a UI interaction may use these two tokens. */
        --wake: hsl(38 76% 42%);
        --row-flash-bg: hsl(43 88% 92%);

        /* Dark palette. Same hues as above, lightness retuned. Compare each
           line with its light counterpart; a differing hue is a bug. */
        --dark-bg: hsl(215 15% 9%);
        --dark-panel: hsl(217 16% 13%);
        --dark-border: hsl(216 14% 21%);
        --dark-text: hsl(215 15% 91%);
        --dark-muted: hsl(214 12% 65%);
        --dark-accent: hsl(220 100% 71%);
        --dark-ok: hsl(149 52% 55%);
        --dark-err: hsl(0 100% 73%);
        --dark-wake: hsl(43 73% 57%);
        --dark-row-flash-bg: hsl(41 53% 15%);

        /* One family, sans only. There is deliberately no font chooser: this
           is a dense data view, not a reading surface. */
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

        /* UI motion: neutral, short, for view changes only. */
        --transition-fast: 150ms ease;
        /* DATA motion: long enough to notice across a full table, short
           enough not to linger. Removal is faster because the row is
           leaving and should not hold the reader. */
        --motion-data-in: 900ms;
        --motion-data-out: 320ms;

        --radius: 6px;
      }
      @media (prefers-color-scheme: dark) {
        /* System dark, unless the reader explicitly chose light. */
        :root:not([data-theme='light']) {
          --bg: var(--dark-bg);
          --panel: var(--dark-panel);
          --border: var(--dark-border);
          --text: var(--dark-text);
          --muted: var(--dark-muted);
          --accent: var(--dark-accent);
          --ok: var(--dark-ok);
          --err: var(--dark-err);
          --wake: var(--dark-wake);
          --row-flash-bg: var(--dark-row-flash-bg);
        }
      }
      :root[data-theme='dark'] {
        /* Explicit dark, so the choice wins under a light system too. */
        --bg: var(--dark-bg);
        --panel: var(--dark-panel);
        --border: var(--dark-border);
        --text: var(--dark-text);
        --muted: var(--dark-muted);
        --accent: var(--dark-accent);
        --ok: var(--dark-ok);
        --err: var(--dark-err);
        --wake: var(--dark-wake);
        --row-flash-bg: var(--dark-row-flash-bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--sans);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      h1 {
        font-size: 15px;
        margin: 0 6px 0 0;
        font-weight: 650;
      }
      .pill {
        /* Chrome, not data: counts and phase words render sans like the rest of the
           frame. Only #tippill below is monospace, because its content is a branch
           name and commit — actual data values. */
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
        transition:
          color var(--transition-fast),
          border-color var(--transition-fast);
      }
      .pill.watching {
        color: var(--ok);
        border-color: var(--ok);
      }
      .pill.applying {
        color: var(--wake);
        border-color: var(--wake);
      }
      .pill.error {
        color: var(--err);
        border-color: var(--err);
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        margin-right: 5px;
        vertical-align: middle;
      }
      .pill.watching .dot {
        animation: pulse-dot 1.8s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      #tippill {
        font-family: var(--mono);
      }
      .grow {
        flex: 1;
      }
      /* ── Settings gear and theme chooser ────────────────────────────
         A gear opening a segmented radio group, after metabrowser/kpress.
         Theme only: no font chooser, because this view is sans-only. */
      #settings {
        position: relative;
      }
      #gear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        color: var(--muted);
        border-radius: var(--radius);
      }
      #gear:hover,
      #gear[aria-expanded='true'] {
        color: var(--accent);
        border-color: var(--accent);
      }
      #gear svg {
        width: 15px;
        height: 15px;
      }
      #menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px;
        z-index: 10;
        min-width: 150px;
      }
      #menu[hidden] {
        display: none;
      }
      .menu-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .chooser {
        display: flex;
        gap: 4px;
      }
      .seg {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 0;
        color: var(--muted);
      }
      .seg svg {
        width: 15px;
        height: 15px;
      }
      .seg[aria-checked='true'] {
        color: var(--accent);
        border-color: var(--accent);
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 4px 8px;
        transition: border-color var(--transition-fast);
      }
      button {
        cursor: pointer;
      }
      button:hover,
      input:focus,
      select:focus {
        border-color: var(--accent);
        outline: none;
      }
      button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      label.check {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      #cmdbar {
        padding: 7px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #cmd {
        color: var(--text);
        user-select: all;
        word-break: break-all;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        align-items: start;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 700px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 1;
      }
      td.id {
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }
      td.caret {
        width: 18px;
        color: var(--muted);
        user-select: none;
        padding-right: 0;
      }
      tbody tr:not(.bodyrow) {
        cursor: pointer;
      }
      tbody tr:not(.bodyrow):hover {
        background: var(--panel);
      }
      tr.open > td {
        border-bottom: none;
        font-weight: 600;
      }
      tr.context > td:not(.caret) {
        opacity: 0.5;
      }
      tr.bodyrow > td {
        padding: 0 10px 12px 28px;
        background: var(--panel);
      }
      .guide {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--border);
        white-space: pre;
        user-select: none;
      }
      /* ── DATA motion ────────────────────────────────────────────────
         Applied only when the server reports a new `dataVersion`. Never
         applied because a filter, sort, or expand changed what is visible.
         `.flash` is set for exactly one render and then cleared, so a row
         that stays changed does not keep animating. */
      tr.flash > td {
        animation: row-flash-in var(--motion-data-in) ease-out;
      }
      @keyframes row-flash-in {
        0% {
          background-color: var(--row-flash-bg);
        }
        100% {
          background-color: transparent;
        }
      }
      /* A deleted bead is gone from the data before the reader sees it, so
         the row is held for one collapse and then dropped. `forwards` keeps
         the final frame until the JS removal lands. */
      tr.leaving > td {
        animation: row-flash-out var(--motion-data-out) ease-in forwards;
        pointer-events: none;
        overflow: hidden;
      }
      @keyframes row-flash-out {
        0% {
          background-color: var(--row-flash-bg);
          opacity: 1;
          max-height: 4em;
        }
        100% {
          background-color: var(--row-flash-bg);
          opacity: 0;
          max-height: 0;
        }
      }
      /* Persistent marker for "this bead is in the latest watch report".
         A state, not motion, so it survives re-renders and filter changes. */
      tr.changed td.id::after {
        content: ' ●';
        color: var(--wake);
      }
      @media (prefers-reduced-motion: reduce) {
        /* Keep the amber context, drop the movement. */
        tr.flash > td,
        tr.leaving > td {
          animation-duration: 1ms;
        }
        .pill.watching .dot {
          animation: none;
        }
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        margin: 0 3px 2px 0;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .tag.ready {
        color: var(--ok);
        border-color: var(--ok);
      }
      aside {
        border-left: 1px solid var(--border);
        padding: 12px 14px;
        min-height: 60vh;
      }
      @media (max-width: 900px) {
        aside {
          border-left: none;
          border-top: 1px solid var(--border);
        }
      }
      aside h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      aside h2:first-child {
        margin-top: 0;
      }
      /* Each panel names the command it mirrors, the same contract as the
         equivalent-command bar over the table. */
      .hint {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: none;
        letter-spacing: 0;
        opacity: 0.75;
        margin-left: 4px;
      }
      #stats {
        width: 100%;
        border-collapse: collapse;
        min-width: 0;
      }
      #stats td,
      #stats th {
        border: none;
        padding: 2px 0;
        font-size: 12px;
      }
      #stats td.num,
      #stats th.num {
        text-align: right;
        /* Counts are chrome: sans, with tabular figures so columns still align. */
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        width: 46px;
      }
      #stats tr.group td {
        padding-top: 9px;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #stats tr.total td {
        border-top: 1px solid var(--border);
        font-weight: 650;
      }
      #stats td.ico {
        width: 14px;
        font-family: var(--mono);
      }
      dd.bad {
        color: var(--err);
      }
      dd.good {
        color: var(--ok);
      }
      pre {
        font-family: var(--mono);
        font-size: 11px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px;
        overflow-x: auto;
        margin: 0;
        max-height: 300px;
      }
      .blabel {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 10px 0 3px;
      }
      .btext {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
      }
      .btext.mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      .btext.err {
        color: var(--err);
      }
      .skeleton {
        display: inline-block;
        width: 120px;
        height: 0.85em;
        background: var(--border);
        border-radius: 4px;
        animation: skeleton-pulse 1.6s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.85;
        }
      }
      .delta {
        border-left: 3px solid var(--wake);
        padding: 2px 0 6px 10px;
        margin-top: 8px;
      }
      .dfield {
        margin: 3px 0;
        font-size: 12px;
      }
      .dname {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--wake);
        margin-right: 8px;
      }
      .dval {
        font-family: var(--mono);
        font-size: 11px;
        word-break: break-all;
      }
      pre.hunk {
        margin: 3px 0 0;
        max-height: 200px;
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 12px;
        max-height: 280px;
        overflow-y: auto;
      }
      #log li {
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
      }
      #log li.wake {
        color: var(--wake);
      }
      #log li.error {
        color: var(--err);
      }
      #log time {
        font-family: var(--mono);
        font-size: 10px;
        opacity: 0.7;
        margin-right: 6px;
      }
      dl {
        margin: 0;
        font-size: 12px;
      }
      dt {
        color: var(--muted);
        float: left;
        clear: left;
        width: 78px;
      }
      dd {
        margin: 0 0 3px 84px;
        font-family: var(--mono);
        font-size: 11px;
        word-break: break-all;
      }
      .empty {
        padding: 30px 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>tbd beads</h1>
      <span class="pill" id="countpill">0 beads</span>
      <span class="grow"></span>
      <!-- Live-state cluster: everything about the watcher sits together on the right,
           next to the branch it is watching, so it reads as one status area. -->
      <span class="pill" id="wakepill">0 wakes</span>
      <span class="pill" id="watchpill"><span class="dot"></span>connecting</span>
      <span class="pill" id="tippill"></span>
      <span id="settings">
        <button id="gear" type="button" aria-label="Settings" aria-expanded="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div id="menu" role="menu" hidden>
          <div class="menu-label">Theme</div>
          <div class="chooser" role="group" aria-label="Theme">
            <button
              type="button"
              class="seg"
              role="menuitemradio"
              data-theme-choice="system"
              aria-checked="false"
              title="System theme"
              aria-label="System theme"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="20" height="14" x="2" y="3" rx="2" />
                <line x1="8" x2="16" y1="21" y2="21" />
                <line x1="12" x2="12" y1="17" y2="21" />
              </svg>
            </button>
            <button
              type="button"
              class="seg"
              role="menuitemradio"
              data-theme-choice="light"
              aria-checked="false"
              title="Light theme"
              aria-label="Light theme"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>
            <button
              type="button"
              class="seg"
              role="menuitemradio"
              data-theme-choice="dark"
              aria-checked="false"
              title="Dark theme"
              aria-label="Dark theme"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>
            </button>
          </div>
        </div>
      </span>
    </header>

    <div id="toolbar">
      <input id="q" type="search" placeholder="Search id, title, label, spec" size="26" />
      <!-- Control labels stay plain words; the equivalent command below is where the
           flags are shown, so the mapping is taught in one place rather than repeated. -->
      <!-- One control, a bijection onto the CLI's reachable status states: active is
           the tbd list default (closed hidden), "any" is --all, and a named status is
           --status X (where --all would be a no-op). Two separate controls allowed
           redundant states and made "any" a lie. -->
      <select id="status" title="--status / --all">
        <option value="">status: active</option>
        <option value="any">any (incl. closed)</option>
        <option value="open">open</option>
        <option value="in_progress">in_progress</option>
        <option value="blocked">blocked</option>
        <option value="deferred">deferred</option>
        <option value="closed">closed</option>
      </select>
      <select id="type" title="--type">
        <option value="">type: any</option>
        <option value="bug">bug</option>
        <option value="feature">feature</option>
        <option value="task">task</option>
        <option value="epic">epic</option>
        <option value="chore">chore</option>
      </select>
      <select id="priority" title="--priority">
        <option value="">priority: any</option>
        <option value="0">P0</option>
        <option value="1">P1</option>
        <option value="2">P2</option>
        <option value="3">P3</option>
        <option value="4">P4</option>
      </select>
      <input id="label" placeholder="label" size="10" title="--label" />
      <input id="spec" placeholder="spec" size="12" title="--spec" />
      <select id="sort" title="--sort">
        <option value="priority">sort: priority</option>
        <option value="created">sort: created</option>
        <option value="updated">sort: updated</option>
      </select>
      <label class="check" title="--ready"><input type="checkbox" id="ready" /> ready</label>
      <span class="grow"></span>
      <button id="pretty" class="on" title="--pretty">tree</button>
      <button id="expandall">Expand all</button>
    </div>

    <div id="cmdbar"><span>equivalent:</span><span id="cmd">tbd list --pretty</span></div>

    <main>
      <div id="tablewrap">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>ID</th>
              <th>P</th>
              <th>Status</th>
              <th>Kind</th>
              <th>Title</th>
              <th>Labels</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No beads match this query.</div>
      </div>

      <aside>
        <h2>Status <span class="hint">tbd status</span></h2>
        <dl id="statusdl"></dl>
        <h2>Stats <span class="hint">tbd stats</span></h2>
        <table id="stats"></table>
        <h2>Latest watch report</h2>
        <pre id="report">No change reported yet. The watcher is idle.</pre>
        <h2>Event log</h2>
        <ul id="log"></ul>
      </aside>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const els = {
        rows: $('rows'),
        empty: $('empty'),
        report: $('report'),
        log: $('log'),
        statusdl: $('statusdl'),
        stats: $('stats'),
        cmd: $('cmd'),
        watchpill: $('watchpill'),
        wakepill: $('wakepill'),
        countpill: $('countpill'),
        tippill: $('tippill'),
        q: $('q'),
        status: $('status'),
        type: $('type'),
        priority: $('priority'),
        label: $('label'),
        spec: $('spec'),
        sort: $('sort'),
        ready: $('ready'),
        pretty: $('pretty'),
        expandall: $('expandall'),
      };

      let board = null;
      let watch = null;
      let pretty = true;
      /** Bead ids whose body is open. Survives re-render, so a wake cannot collapse one. */
      const expanded = new Set();
      const bodies = new Map();
      const inFlight = new Set();
      /**
       * DATA motion state. `flashOnce` is populated only when the server reports a new
       * dataVersion, and cleared after one render. A filter, sort, or expand never
       * touches it, so re-slicing the view is silent by construction.
       */
      let flashOnce = new Set();
      let ghostRows = [];
      let ghostTimer = null;
      let lastDataVersion = 0;
      /**
       * Board request state (senior review R4/R5, tbd-uuo4/tbd-7wgw). One request in
       * flight at a time; a wake or filter edit during flight queues exactly one
       * follow-up, so a movement can never be silently dropped. Every request carries a
       * generation, and only the latest generation's response is applied, so overlapping
       * responses cannot finish out of order and roll the view back.
       */
      let boardInFlight = false;
      let boardGeneration = 0;
      let refreshQueued = false;
      /** Bumped on every data wake; body responses from an older world are re-issued. */
      let bodyGeneration = 0;

      const short = (v) => (v ? String(v).slice(0, 8) : 'none');

      /** Build the query string from the controls. Names match the CLI flags exactly. */
      function queryString() {
        const p = new URLSearchParams();
        if (els.q.value.trim()) p.set('q', els.q.value.trim());
        if (els.status.value && els.status.value !== 'any') p.set('status', els.status.value);
        if (els.type.value) p.set('type', els.type.value);
        if (els.priority.value) p.set('priority', els.priority.value);
        if (els.spec.value.trim()) p.set('spec', els.spec.value.trim());
        for (const label of els.label.value.split(/[,\s]+/).filter(Boolean)) {
          p.append('label', label);
        }
        if (els.sort.value !== 'priority') p.set('sort', els.sort.value);
        if (els.status.value === 'any') p.set('all', '1');
        if (els.ready.checked) p.set('ready', '1');
        if (pretty) p.set('pretty', '1');
        return p.toString();
      }

      /**
       * One board fetch at a time. A call during flight queues one follow-up rather
       * than being dropped — the old same-query dedup meant a wake during an identical
       * in-flight request never refetched and the "live" table sat stale (R4). On
       * completion the follow-up also fires if the filters changed mid-flight, and only
       * the newest generation's response is applied (R5).
       */
      function refresh() {
        if (boardInFlight) {
          refreshQueued = true;
          return;
        }
        boardInFlight = true;
        const generation = ++boardGeneration;
        const qs = queryString();
        fetch('/api/board?' + qs)
          .then((r) => r.json())
          .then((data) => {
            if (generation !== boardGeneration) return; // a newer request owns the view
            board = data;
            // The board embeds a watch snapshot for first paint, but SSE is the
            // authority on liveness: never let an older embedded snapshot roll back a
            // newer dataVersion's wake markers (R5 / tbd-7wgw).
            if (!watch || data.state.dataVersion >= watch.dataVersion) {
              watch = data.state;
            }
            render();
          })
          .catch(() => {})
          .finally(() => {
            boardInFlight = false;
            if (refreshQueued || qs !== queryString()) {
              refreshQueued = false;
              refresh();
            }
          });
      }

      function loadBody(id, force) {
        if (inFlight.has(id)) return;
        if (!force && bodies.has(id)) return;
        inFlight.add(id);
        const generation = bodyGeneration;
        fetch('/api/bead?' + new URLSearchParams({ id }).toString())
          .then((r) => r.json())
          .then((record) => {
            if (generation !== bodyGeneration) {
              // This response describes the pre-wake world; refetch instead of caching
              // it, so an expanded row cannot stay stale forever (R6 / tbd-j3bi).
              inFlight.delete(id);
              if (expanded.has(id)) loadBody(id, true);
              return;
            }
            bodies.set(id, record);
          })
          .catch((error) => bodies.set(id, { error: String(error) }))
          .finally(() => {
            inFlight.delete(id);
            render();
          });
      }

      function toggle(id) {
        if (expanded.has(id)) {
          expanded.delete(id);
        } else {
          expanded.add(id);
          loadBody(id, false);
        }
        render();
      }

      function changeFor(id) {
        if (!watch || !watch.lastReport) return null;
        // The report's field deltas describe one specific movement. A local wake
        // advances dataVersion without a report, so a stale stamp means the deltas
        // belong to an earlier remote wake and must not be shown as current.
        if (watch.reportDataVersion !== watch.dataVersion) return null;
        return watch.lastReport.changes.find((c) => c.id === id) || null;
      }

      function section(parent, label, value, mono) {
        if (value === undefined || value === null || value === '') return;
        const h = document.createElement('div');
        h.className = 'blabel';
        h.textContent = label;
        parent.appendChild(h);
        const body = document.createElement('div');
        body.className = mono ? 'btext mono' : 'btext';
        body.textContent = value;
        parent.appendChild(body);
      }

      function buildBody(id) {
        const wrap = document.createElement('div');
        const record = bodies.get(id);

        const delta = changeFor(id);
        if (delta) {
          const box = document.createElement('div');
          box.className = 'delta';
          const head = document.createElement('div');
          head.className = 'blabel';
          head.textContent = 'Changed in the latest wake (' + delta.change + ')';
          box.appendChild(head);
          for (const f of delta.fields) {
            const line = document.createElement('div');
            line.className = 'dfield';
            const name = document.createElement('span');
            name.className = 'dname';
            name.textContent = f.field;
            line.appendChild(name);
            if (f.hunks && f.hunks.length) {
              const pre = document.createElement('pre');
              pre.className = 'hunk';
              pre.textContent = f.hunks
                .map((h) =>
                  h.lines
                    .map((l) => (l.type === 'add' ? '+' : l.type === 'remove' ? '-' : ' ') + l.text)
                    .join('\n'),
                )
                .join('\n...\n');
              line.appendChild(pre);
            } else {
              const val = document.createElement('span');
              val.className = 'dval';
              val.textContent = JSON.stringify(f.before) + '  →  ' + JSON.stringify(f.after);
              line.appendChild(val);
            }
            box.appendChild(line);
          }
          wrap.appendChild(box);
        }

        if (!record) {
          const h = document.createElement('div');
          h.className = 'blabel';
          h.textContent = 'Loading';
          wrap.appendChild(h);
          const sk = document.createElement('span');
          sk.className = 'skeleton';
          wrap.appendChild(sk);
          return wrap;
        }
        if (record.error) {
          const err = document.createElement('div');
          err.className = 'btext err';
          err.textContent = record.error;
          wrap.appendChild(err);
          return wrap;
        }

        section(wrap, 'Description', record.description);
        section(wrap, 'Notes', record.notes);
        section(wrap, 'Spec', record.spec_path, true);
        section(wrap, 'Assignee', record.assignee);
        if (record.parent) section(wrap, 'Parent', record.parent, true);
        if (record.dependencies && record.dependencies.length) {
          section(
            wrap,
            'Dependencies',
            record.dependencies.map((d) => d.type + ' → ' + d.target).join('\n'),
            true,
          );
        }
        section(wrap, 'Due', record.due_date, true);
        section(wrap, 'Deferred until', record.deferred_until, true);
        section(wrap, 'Close reason', record.close_reason);
        section(
          wrap,
          'Timestamps',
          'created  ' +
            record.created_at +
            '\nupdated  ' +
            record.updated_at +
            '\nversion  ' +
            record.version,
          true,
        );
        return wrap;
      }

      /** The `tbd status` panel, plus the watcher facts that only this process knows. */
      function renderStatus() {
        const s = watch.repoStatus;
        els.statusdl.textContent = '';
        const rows = [
          ['repo', watch.repoDir, ''],
          ['tbd', s ? s.tbdVersion : '…', ''],
          ['branch', s ? s.gitBranch || 'detached' : '…', ''],
          ['sync', watch.remote + '/' + watch.syncBranch, ''],
          ['tip', short(watch.localTip), ''],
          ['prefix', s ? s.displayPrefix : '…', ''],
          [
            'worktree',
            s ? (s.worktreeHealthy ? 'healthy' : s.worktreeStatus || 'unhealthy') : '…',
            s ? (s.worktreeHealthy ? 'good' : 'bad') : '',
          ],
          ['workspaces', s && s.workspaces.length ? s.workspaces.join(', ') : 'none', ''],
          [
            'watching',
            'since ' + short(watch.watchSince) + ', every ' + watch.intervalSeconds + 's',
            '',
          ],
        ];
        if (watch.writerDir) rows.push(['writer', watch.writerDir, '']);
        for (const [k, v, cls] of rows) {
          const dt = document.createElement('dt');
          dt.textContent = k;
          const dd = document.createElement('dd');
          if (cls) dd.className = cls;
          dd.textContent = v;
          els.statusdl.appendChild(dt);
          els.statusdl.appendChild(dd);
        }
      }

      const STATUS_ICON = {
        open: '○',
        in_progress: '◐',
        blocked: '●',
        deferred: '○',
        closed: '✓',
      };
      const PRIORITY_LABEL = ['Critical', 'High', 'Medium', 'Low', 'Lowest'];

      /** The `tbd stats` panel, rendered from the same aggregate the CLI prints. */
      function renderStats() {
        const st = watch.stats;
        els.stats.textContent = '';
        if (!st) return;

        const row = (cells, cls) => {
          const tr = document.createElement('tr');
          if (cls) tr.className = cls;
          for (const [text, tdCls] of cells) {
            const td = document.createElement('td');
            if (tdCls) td.className = tdCls;
            td.textContent = text;
            tr.appendChild(td);
          }
          els.stats.appendChild(tr);
        };

        row(
          [
            ['By status', ''],
            ['', 'num'],
          ],
          'group',
        );
        for (const key of ['open', 'in_progress', 'blocked', 'deferred']) {
          row([
            [STATUS_ICON[key], 'ico'],
            [key, ''],
            [String(st.byStatus[key]), 'num'],
          ]);
        }
        row(
          [
            ['', 'ico'],
            ['active', ''],
            [String(st.active), 'num'],
          ],
          'total',
        );
        row([
          [STATUS_ICON.closed, 'ico'],
          ['closed', ''],
          [String(st.closed), 'num'],
        ]);
        row(
          [
            ['', 'ico'],
            ['total', ''],
            [String(st.total), 'num'],
          ],
          'total',
        );

        row(
          [
            ['By kind', ''],
            ['active', 'num'],
            ['closed', 'num'],
          ],
          'group',
        );
        for (const kind of ['bug', 'feature', 'task', 'epic', 'chore']) {
          const a = st.byKindActive[kind] || 0;
          const c = st.byKindClosed[kind] || 0;
          if (a + c === 0) continue;
          row([
            [kind, ''],
            [String(a), 'num'],
            [String(c), 'num'],
          ]);
        }

        row(
          [
            ['By priority', ''],
            ['active', 'num'],
            ['closed', 'num'],
          ],
          'group',
        );
        for (let i = 0; i <= 4; i++) {
          const a = st.byPriorityActive[i] || 0;
          const c = st.byPriorityClosed[i] || 0;
          if (a + c === 0) continue;
          row([
            ['P' + i + ' ' + PRIORITY_LABEL[i], ''],
            [String(a), 'num'],
            [String(c), 'num'],
          ]);
        }
      }

      function render() {
        if (!board || !watch) return;
        const contextIds = new Set(board.contextIds || []);
        const changed = new Set(watch.changedIds || []);

        // "blocked" described the syscall, not the situation, and collided with the bead
        // status of the same name. These say what the watcher is doing for the reader.
        const PHASE = {
          starting: ['starting', 'Establishing a baseline against the sync remote.'],
          watching: [
            'watching',
            'Idle and up to date. `tbd watch` is waiting on ' +
              watch.remote +
              '/' +
              watch.syncBranch +
              ', checking every ' +
              watch.intervalSeconds +
              's. The page updates by itself when a bead changes.',
          ],
          applying: ['updating', 'A change arrived. Pulling and re-reading before redrawing.'],
          error: ['error', watch.watchError || 'The watcher failed; retrying.'],
          stopped: ['stopped', 'The viewer is shutting down.'],
        };
        const [phaseLabel, phaseHelp] = PHASE[watch.watchPhase] || [watch.watchPhase, ''];
        els.watchpill.textContent = '';
        const dot = document.createElement('span');
        dot.className = 'dot';
        els.watchpill.appendChild(dot);
        els.watchpill.appendChild(document.createTextNode(phaseLabel));
        els.watchpill.className = 'pill ' + watch.watchPhase;
        els.watchpill.title = phaseHelp;
        els.wakepill.textContent = watch.wakeCount + (watch.wakeCount === 1 ? ' wake' : ' wakes');
        els.wakepill.title =
          'Times the graph has changed since this viewer started. Each wake is one ' +
          '`tbd watch` report, pulled and applied.';
        // A count like "244 of 1372" with no visible filter reads as a bug, so the one
        // filter that is on by default (closed hidden, matching tbd list) names itself
        // in the pill whenever it is the thing narrowing the view.
        const hiddenNote = board.closedHidden ? ' · ' + board.closedHidden + ' closed hidden' : '';
        els.countpill.textContent =
          (board.matched === board.total
            ? board.total + ' beads'
            : board.matched + ' of ' + board.total) + hiddenNote;
        els.countpill.title = board.closedHidden
          ? 'Closed beads are hidden under "active", matching tbd list. Pick status "any" or "closed" to include ' +
            board.closedHidden +
            ' more.'
          : 'Beads matching the current query, out of the whole graph.';
        els.tippill.title =
          'The sync branch being watched, at its current local commit. Resuming from ' +
          short(watch.watchSince) +
          '.';
        els.tippill.textContent =
          watch.remote + '/' + watch.syncBranch + ' @ ' + short(watch.localTip);
        // The bar shows only the command, in monospace, so nothing reads as accidental
        // arguments; the ways the view differs from the command (default-hidden closed
        // beads aside) are enumerated in the tooltip instead.
        const caveats = [];
        if (!board.filtersExact) caveats.push('filters with no tbd ready equivalent apply');
        if (board.search) caveats.push('text search "' + board.search + '" applies');
        if (board.contextCount) {
          caveats.push(board.contextCount + ' dimmed ancestor row(s) are shown for context');
        }
        els.cmd.textContent = board.command;
        els.cmd.title = board.commandExact
          ? 'Run this to reproduce the table below.'
          : 'Close but not exact: ' + caveats.join('; ') + '.';
        els.pretty.className = pretty ? 'on' : '';

        const rows = board.rows || [];
        els.empty.hidden = rows.length > 0;
        els.expandall.textContent =
          rows.length && rows.every((r) => expanded.has(r.id)) ? 'Collapse all' : 'Expand all';

        els.rows.textContent = '';
        // Deleted beads are already absent from the data, so they are drawn once more
        // as leaving rows. This is DATA motion; nothing here runs for a view change.
        for (const ghost of ghostRows) {
          const tr = document.createElement('tr');
          tr.className = 'leaving';
          const caret = document.createElement('td');
          caret.className = 'caret';
          tr.appendChild(caret);
          for (const [text, cls] of [
            [ghost.id, 'id'],
            ['P' + ghost.priority, ''],
            ['deleted', ''],
            [ghost.kind, ''],
            [ghost.title, ''],
            ['', ''],
          ]) {
            const td = document.createElement('td');
            if (cls) td.className = cls;
            td.textContent = text;
            tr.appendChild(td);
          }
          els.rows.appendChild(tr);
        }

        for (const row of rows) {
          const isOpen = expanded.has(row.id);
          const tr = document.createElement('tr');
          const classes = [];
          if (changed.has(row.id)) classes.push('changed');
          if (isOpen) classes.push('open');
          if (contextIds.has(row.id)) classes.push('context');
          // DATA motion only. Deliberately not "row is newly visible": a filter that
          // reveals a row is a view change and must stay silent.
          if (flashOnce.has(row.id)) classes.push('flash');
          tr.className = classes.join(' ');

          const caret = document.createElement('td');
          caret.className = 'caret';
          caret.textContent = isOpen ? '▾' : '▸';
          tr.appendChild(caret);

          const add = (text, cls) => {
            const td = document.createElement('td');
            if (cls) td.className = cls;
            td.textContent = text;
            tr.appendChild(td);
          };

          add(row.id, 'id');
          add('P' + row.priority);
          add(row.status);
          add(row.kind);

          const title = document.createElement('td');
          if (row.prefix) {
            const guide = document.createElement('span');
            guide.className = 'guide';
            guide.textContent = row.prefix;
            title.appendChild(guide);
          }
          title.appendChild(document.createTextNode(row.title));
          tr.appendChild(title);

          const tags = document.createElement('td');
          if (row.ready) {
            const s = document.createElement('span');
            s.className = 'tag ready';
            s.textContent = 'ready';
            tags.appendChild(s);
          }
          for (const label of row.labels || []) {
            const s = document.createElement('span');
            s.className = 'tag';
            s.textContent = label;
            tags.appendChild(s);
          }
          tr.appendChild(tags);
          tr.addEventListener('click', () => toggle(row.id));
          els.rows.appendChild(tr);

          if (isOpen) {
            const bodyRow = document.createElement('tr');
            bodyRow.className = 'bodyrow';
            const cell = document.createElement('td');
            cell.colSpan = 7;
            cell.appendChild(buildBody(row.id));
            bodyRow.appendChild(cell);
            els.rows.appendChild(bodyRow);
          }
        }
        flashOnce = new Set();

        if (board.truncated) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 7;
          td.textContent =
            'Truncated: showing ' +
            rows.length +
            ' of ' +
            board.truncated +
            ' rows. Narrow the query.';
          tr.appendChild(td);
          els.rows.appendChild(tr);
        }

        els.report.textContent = watch.lastReport
          ? JSON.stringify(watch.lastReport, null, 2)
          : 'No change reported yet. The watcher is idle.';

        renderStatus();
        renderStats();

        els.log.textContent = '';
        for (const entry of (watch.log || []).slice(0, 60)) {
          const li = document.createElement('li');
          li.className = entry.level;
          const t = document.createElement('time');
          t.textContent = entry.at.slice(11, 19);
          li.appendChild(t);
          li.appendChild(document.createTextNode(entry.message));
          els.log.appendChild(li);
        }
      }

      function connect() {
        const source = new EventSource('/api/events');
        source.addEventListener('state', (event) => {
          const next = JSON.parse(event.data);
          // dataVersion is the single authority for "the graph moved". Watcher phase
          // changes, poll recycles, and heartbeats all leave it alone, so they re-render
          // without animating anything.
          const dataMoved = next.dataVersion > lastDataVersion;
          const previousRows = dataMoved && board ? board.rows || [] : [];
          watch = next;
          document.title = 'tbd beads (' + next.totalBeads + ')';

          if (!dataMoved) {
            render();
            return;
          }
          lastDataVersion = next.dataVersion;
          flashOnce = new Set(next.movedIds || []);

          // Hold deleted rows that were actually on screen for one collapse animation.
          const removed = new Set(next.removedIds || []);
          ghostRows = previousRows.filter((r) => removed.has(r.id));
          if (ghostTimer) clearTimeout(ghostTimer);
          if (ghostRows.length) {
            ghostTimer = setTimeout(() => {
              ghostRows = [];
              render();
            }, 400);
          }

          // Cached bodies are stale after a move; bump the body generation so any
          // in-flight pre-wake response is discarded and refetched (R6), then refetch
          // the ones still open so an expanded bead updates in place.
          bodyGeneration += 1;
          bodies.clear();
          for (const id of expanded) loadBody(id, true);
          refresh();
        });
        source.addEventListener('error', () => {
          els.watchpill.textContent = 'disconnected';
          els.watchpill.className = 'pill error';
        });
      }

      let debounce = null;
      const onInput = () => {
        clearTimeout(debounce);
        debounce = setTimeout(refresh, 120);
      };
      for (const el of [els.q, els.label, els.spec]) el.addEventListener('input', onInput);
      for (const el of [els.status, els.type, els.priority, els.sort, els.ready]) {
        el.addEventListener('change', refresh);
      }
      els.pretty.addEventListener('click', () => {
        pretty = !pretty;
        refresh();
      });
      els.expandall.addEventListener('click', () => {
        const ids = (board ? board.rows : []).map((r) => r.id);
        const allOpen = ids.length > 0 && ids.every((id) => expanded.has(id));
        for (const id of ids) {
          if (allOpen) {
            expanded.delete(id);
          } else {
            expanded.add(id);
            loadBody(id, false);
          }
        }
        render();
      });

      /* ── Theme chooser ─────────────────────────────────────────────
         `data-theme-mode` is the choice, `data-theme` is what it resolved to.
         "system" stamps no data-theme so the media query stays in charge, and
         a live OS change is picked up while that mode is selected. */
      const gear = $('gear');
      const menu = $('menu');
      const segs = Array.from(menu.querySelectorAll('[data-theme-choice]'));

      function applyThemeMode(mode, persist) {
        const normalized = ['system', 'light', 'dark'].includes(mode) ? mode : 'system';
        document.documentElement.setAttribute('data-theme-mode', normalized);
        if (normalized === 'system') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', normalized);
        }
        for (const seg of segs) {
          seg.setAttribute(
            'aria-checked',
            seg.dataset.themeChoice === normalized ? 'true' : 'false',
          );
        }
        if (persist) {
          try {
            localStorage.setItem('tbd.themeMode', normalized);
          } catch (e) {
            /* Storage unavailable: the choice still applies for this session. */
          }
        }
      }

      const closeMenu = () => {
        menu.hidden = true;
        gear.setAttribute('aria-expanded', 'false');
      };
      gear.addEventListener('click', (event) => {
        event.stopPropagation();
        menu.hidden = !menu.hidden;
        gear.setAttribute('aria-expanded', String(!menu.hidden));
      });
      menu.addEventListener('click', (event) => event.stopPropagation());
      document.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeMenu();
      });
      for (const seg of segs) {
        seg.addEventListener('click', () => applyThemeMode(seg.dataset.themeChoice, true));
      }
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if (document.documentElement.getAttribute('data-theme-mode') === 'system') {
            applyThemeMode('system', false);
          }
        });
      }
      applyThemeMode(document.documentElement.getAttribute('data-theme-mode') || 'system', false);

      refresh();
      connect();
    </script>
  </body>
</html>
